services:
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: tennet-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tennetadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-TenNetMinioDemo2026!}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-tennetadmin} ${MINIO_ROOT_PASSWORD:-TenNetMinioDemo2026!}); do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb myminio/tennet-inventory --ignore-existing;
      /usr/bin/mc anonymous set none myminio/tennet-inventory;
      exit 0;
      "

volumes:
  minio_data:
